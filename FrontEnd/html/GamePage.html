<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Rogue Archer - Game</title>

    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/gamePage.css">
<script type="module" src="../javascript/gamePage.js"></script>

</head>

<body>

    <main class="game-page">

        <!-- Score -->
        <div class="score">
    SCORE: <span id="score">0</span>
    <br>
    KILLS: <span id="kills">0</span>
     <br>
    COINS: <span id="coins">0</span>
</div>


        <!-- Game Area -->
        <div class="game-area">

    <canvas id="gameCanvas"></canvas>

    <div class="hero-stats">
        <div class="health">
    HEALTH: <span id="health">100</span>
    <div class="health-bar">
        <div id="healthFill"></div>
    </div>
</div>

        <div class="arrows">
            ARROWS: <span id="arrowCount">10</span>
        </div>
         <div class="accuracy">
        ACCURACY: <span id="accuracy">0%</span>
    </div>

    </div>

</div>


<div id="gameOverMenu">

    <h1>GAME OVER</h1>

    <p>YOUR SCORE: <span id="finalScore">0</span></p>
    <p>YOUR KILLS: <span id="finalKills">0</span></p>
    <p>YOUR COINS: <span id="finalCoins">0</span></p>

    <button id="restartBtn">RESTART</button>
    <button id="exitBtn">EXIT</button>

</div>

        <!-- Settings -->
        <button id="settingsBtn">
            ⚙
        </button>


        <div id="settingsMenu">

            <h2>Settings</h2>

            <button>Music</button>
            <button>Resume</button>
            <button>Restart</button>
            <button>Exit</button>

        </div>

    </main>

</body>

</html>
