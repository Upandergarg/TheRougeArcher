
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop - The Rogue Archer</title>
   <link rel="stylesheet" href="../../css/background.css">
    <link rel="stylesheet" href="../../css/shopPage.css">
     <script src="../../javascript/shopPage.js" defer></script>
</head>

<body>

    <main class="shop-page">

        <h1>Shop</h1>

        <div class="coins">
            Coins: <span id="coins">0</span>
        </div>

   <div class="shop-container">

    <div class="shop-item">
        <div class="item-image">ARROWS</div>
        <h2>Royal Arrows</h2>
        <p>100 Coins</p>
        <button>BUY</button>
    </div>

    <div class="shop-item">
        <div class="item-image">BADGE</div>
        <h2>Rogue Prince Badge</h2>
        <p>300 Coins</p>
        <button>BUY</button>
    </div>

    <div class="shop-item">
        <div class="item-image">AVATAR</div>
        <h2>Rogue Avatar</h2>
        <p>200 Coins</p>
        <button>BUY</button>
    </div>

</div>

        <button id="backBtn">Back to Home</button>

    </main>

   

</body>

</html>
