
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stats - The Rogue Archer</title>
 <link rel="stylesheet" href="../../css/background.css">
    <link rel="stylesheet" href="../../css/statsPage.css">
    
    <script src="../../javascript/statPage.js" defer></script>
</head>

<body>

    <main class="stats-page">

        <h1>Statistics</h1>

        <div class="stats-container">

            <div class="stat-card">
                <h2>Highest Score</h2>
                <p id="highestScore">0</p>
            </div>

            <div class="stat-card">
                <h2>Total Played</h2>
                <p id="totalPlayed">0</p>
            </div>

            <div class="stat-card">
                <h2>Coins</h2>
                <p id="coins">0</p>
            </div>

            <div class="stat-card">
                <h2>Total Kills</h2>
                <p id="totalKills">0</p>
            </div>

            <div class="stat-card">
                <h2>Accuracy</h2>
                <p id="accuracy">0%</p>
            </div>

        </div>

        <button id="backBtn">Back to Home</button>

    </main>


</body>

</html>
