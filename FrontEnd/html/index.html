<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../javascript/homePage.js" defer></script>
    
    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/homePage.css">
    <title>The Rougue Archer</title>

    
</head>

<body>

    <main class="landing">

        <div class="frame"></div>

    


        <!-- Main Content -->
        <section class="content">

            <div class="small-title">
                A Retro Fantasy Archery Adventure
            </div>

            <h1 class="title">
                <span>The Rougue</span>
                <span>Archer</span>
            </h1>

            <div class="subtitle">
                Aim. Shoot. Miss. Remember.
            </div>

            <div class="menu">

                <button class="play" id="playBtn">
                    ⚔ &nbsp; Play Game
                </button>

                <div class="secondary">

                    <button id="guideBtn">
                        Guide
                    </button>

                    <button id="shopBtn">
                        Shop
                    </button>

                    <button id="statsBtn">
                        Stats
                    </button>

                </div>

            </div>

        </section>

        <!-- Player information -->
        <div class="player-info">

            <div class="info-item">
                GOLD
                <strong>1,250</strong>
            </div>

            <div class="info-item">
                BEST WAVE
                <strong>17</strong>
            </div>

        </div>

        <div class="version">
            THE ROGUE PRINCE // 201AC
        </div>

    </main>

    
</body>
</html>
